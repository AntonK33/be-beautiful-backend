tags:
  - Auth
summary: Update-current-user
description: 'Refresh a user'
operationId: update-current-user
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          first_name:
            description: "User's name"
            type: string
            example: 'John'
            minLength: 3
          last_name:
            description: "User's lastname"
            type: string
            example: 'Doe'
            minLength: 3
          dateOfBirth:
            description: "User's dateOfBirth"
            type: string
            example: '18.01.1989'
          email:
            description: "User's email"
            maxLength: 64
            type: string
            example: 'email@example.com'
          password:
            description: "User's password"
            type: string
            example: '12345678'
            minLength: 8
            maxLength: 64
          photo:
            description: "User's photo"
            type: string
            example: 'img_3567.jpeg'
          telephone:
            description: "User's phone number"
            type: string
            example: '0666679494'
          gender:
            description: "User's gender"
            type: string
            enum: ["woman", "man"]
            default: "woman"    
          role:
            type: string
            enum: ["user", "admin"]
            default: "user"  
          agree:
            type: string
            default: "true"
            enum: ["true", "false"]
          language:  
            type: string
            enum: ["en", "uk"] 
            default: "uk"
responses:
  '200':
    description: 'Refreshes the session'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  description: "User's access token"
                  type: string
                  example: 'UitOfpztfXsEqKzi3hIhpkziGELI5FHYlfUpEoGE'
  '401':
    $ref: '../../components/responses/401.yaml'