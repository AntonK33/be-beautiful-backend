description: Conflict error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 500
        message:
          type: string
          example: UnknownError
        data:
          type: string
          example: 'Failed to send the email, please try again later.'