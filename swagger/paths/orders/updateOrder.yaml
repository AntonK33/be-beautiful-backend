patch:
  tags:
    - Orders
  summary: Update an existing order
  parameters:
    - $ref: '#/components/parameters/OrderId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/UpdateOrderRequest'
  responses:
    '200':
      description: Updated order
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
    '404':
      description: Order not found