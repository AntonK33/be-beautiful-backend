tags:
  - Orders
summary: Get low stock products
operationId: reserveProductController
security: []
responses:
  '200':
    description: List of products with stockQuantity < 5
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../../components/schemas/order/OrderProduct.yaml'
