tags:
  - auth
summary: Registration
description: 'Registers the user'
operationId: register
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
            minLength: 3
          email:
            description: "User's email"
            maxLength: 64
            type: string
            example: 'email@example.com'
          password:
            description: "User's password"
            type: string
            example: '12345678'
            minLength: 8
            maxLength: 64
          gender:
            description: "User's gender"
            type: string
            enum: ["woman", "man"]
            default: "woman"    
          role:
            type: string
            enum: ["user", "admin"]
            default: "user"  
          agree:
            type: string
            default: "true"
            enum: ["true", "false"]
          language:  
            type: string
            enum: ["en", "uk"] 
            default: "uk" 
  
responses:
  '201':
    description: 'Creates the user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              $ref: ../../components/schemas/auth.yaml
  '409':
    $ref: '../../components/responses/409.yaml'